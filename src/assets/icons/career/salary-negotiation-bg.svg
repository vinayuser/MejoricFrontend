<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sn-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F1E9"/>
      <stop offset="100%" stop-color="#ECDFCB"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sn-wash)"/>

  <ellipse cx="80" cy="90" rx="160" ry="120" fill="#C8B9E0" opacity="0.35"/>
  <ellipse cx="720" cy="530" rx="170" ry="140" fill="#E0B454" opacity="0.3"/>

  <!-- receipt-style card -->
  <g transform="translate(460,320) rotate(5)">
    <path d="M0,0 h180 l0,150 l-14,-10 l-14,10 l-14,-10 l-14,10 l-14,-10 l-14,10 l-14,-10 l-14,10 l-14,-10 l-14,10 l-14,-10 l-14,10 Z" fill="#FFFDF8" stroke="#E4D3BE" stroke-width="2"/>
    <line x1="16" y1="26" x2="164" y2="24" stroke="#6E5A9B" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="52" x2="140" y2="50" stroke="#DDD0EA" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="78" x2="120" y2="76" stroke="#DDD0EA" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="500" y="300" width="100" height="28" fill="#E0B454" opacity="0.8" transform="rotate(5 550 314)"/>

  <!-- signature: hand-drawn briefcase with coins -->
  <g transform="translate(220,250)">
    <rect x="-70" y="-10" width="140" height="90" rx="10" fill="#8A6B4A" stroke="#5C4530" stroke-width="4"/>
    <path d="M-25,-10 v-20 a25,20 0 0 1 50,0 v20" fill="none" stroke="#5C4530" stroke-width="4"/>
    <rect x="-14" y="20" width="28" height="18" rx="3" fill="#5C4530"/>
    <line x1="-70" y1="30" x2="70" y2="30" stroke="#5C4530" stroke-width="3" opacity="0.5"/>

    <!-- coins stack -->
    <g transform="translate(90,60)">
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="#E0B454" stroke="#B8903A" stroke-width="3"/>
      <ellipse cx="0" cy="-12" rx="30" ry="10" fill="#EAC878" stroke="#B8903A" stroke-width="3"/>
      <ellipse cx="0" cy="-24" rx="30" ry="10" fill="#E0B454" stroke="#B8903A" stroke-width="3"/>
      <text x="0" y="-20" font-family="Georgia, serif" font-size="14" fill="#8A6B33" text-anchor="middle">$</text>
    </g>
  </g>

  <g fill="#6E5A9B">
    <path d="M650,150 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 Z"/>
    <path d="M110,470 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 Z"/>
  </g>

  <path d="M430,490 q20,-16 40,0 t40,0 t40,0 t40,0" fill="none" stroke="#8A6B4A" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <path d="M700,190 c0,-12 -18,-12 -18,0 c0,8 18,20 18,20 s18,-12 18,-20 c0,-12 -18,-12 -18,0 Z" fill="#E5B4B0" opacity="0.75"/>
</svg>
